name: Build and deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build production app
        run: npm run build

      - name: Check deployment credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCNHI_C2D95 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Add the FIREBASE_SERVICE_ACCOUNT_LOCNHI_C2D95 repository secret to deploy.'
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCNHI_C2D95 }}
          projectId: locnhi-c2d95
          channelId: live
